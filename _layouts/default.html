<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ site.description }}">
    <title>{{ page.title | default: site.title }}</title>
    <link rel="stylesheet" href="{{ site.baseurl }}/css/main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

    <!-- ── CRT Boot Sequence ─────────────────────────────────── -->
    <div id="boot-screen">
        <div id="boot-text"></div>
    </div>

    <!-- ── Desktop ───────────────────────────────────────────── -->
    <div id="desktop">

        <!-- Desktop Icons -->
        <div class="desktop-icons">
            <div class="desktop-icon" data-window="win-about">
                <i class="fa-regular fa-file-lines icon"></i>
                <span>about.txt</span>
            </div>
            <div class="desktop-icon" data-window="win-skills">
                <i class="fa-solid fa-microchip icon"></i>
                <span>skills.exe</span>
            </div>
            <div class="desktop-icon" data-window="win-projects">
                <i class="fa-regular fa-folder-open icon"></i>
                <span>projects/</span>
            </div>
            <div class="desktop-icon" data-window="win-experience">
                <i class="fa-solid fa-terminal icon"></i>
                <span>experience.log</span>
            </div>
            <div class="desktop-icon" data-window="win-education">
                <i class="fa-regular fa-file icon"></i>
                <span>education.dat</span>
            </div>
            <div class="desktop-icon" data-window="win-contact">
                <i class="fa-solid fa-satellite-dish icon"></i>
                <span>contact.sh</span>
            </div>
        </div>

        {{ content }}

    </div>

    <!-- ── Taskbar ───────────────────────────────────────────── -->
    <div class="taskbar">
        <button class="start-btn" id="start-btn">
            <i class="fa-solid fa-terminal"></i> PETRE-OS
        </button>
        <div class="taskbar-windows" id="taskbar-windows"></div>
        <div class="taskbar-tray">
            <span class="taskbar-clock" id="taskbar-clock"></span>
        </div>
    </div>

    <!-- ── Start Menu ────────────────────────────────────────── -->
    <div class="start-menu" id="start-menu">
        <div class="start-menu-header">PETRE-OS v3.3</div>
        <div class="start-menu-items">
            <div class="start-menu-item" data-window="win-about"><i class="fa-regular fa-file-lines"></i> about.txt</div>
            <div class="start-menu-item" data-window="win-skills"><i class="fa-solid fa-microchip"></i> skills.exe</div>
            <div class="start-menu-item" data-window="win-projects"><i class="fa-regular fa-folder-open"></i> projects/</div>
            <div class="start-menu-item" data-window="win-experience"><i class="fa-solid fa-terminal"></i> experience.log</div>
            <div class="start-menu-item" data-window="win-education"><i class="fa-regular fa-file"></i> education.dat</div>
            <div class="start-menu-item" data-window="win-contact"><i class="fa-solid fa-satellite-dish"></i> contact.sh</div>
            <div class="start-menu-divider"></div>
            <div class="start-menu-item" id="start-github"><i class="fa-brands fa-github"></i> GitHub</div>
            <div class="start-menu-item" id="start-linkedin"><i class="fa-brands fa-linkedin"></i> LinkedIn</div>
        </div>
    </div>

    <!-- ── Scanlines + Vignette overlays ─────────────────────── -->
    <div class="crt-scanlines"></div>
    <div class="crt-vignette"></div>

    <script>
    (function() {
        // ── Boot sequence ────────────────────────────────────
        var bootScreen = document.getElementById('boot-screen');
        var bootText = document.getElementById('boot-text');
        var desktop = document.getElementById('desktop');
        var taskbar = document.querySelector('.taskbar');

        var bootLines = [
            'PETRE-OS v3.3 BIOS',
            'Copyright (c) 2024 Simon Petre Systems Inc.',
            '',
            'Memory test... 65536K OK',
            'Detecting hardware...',
            '  CPU: Neural Processing Unit x86_ML',
            '  GPU: Tensor Core Array [OK]',
            '  NET: Satellite uplink [CONNECTED]',
            '',
            'Loading kernel modules...',
            '  pytorch.ko          [OK]',
            '  transformer.ko      [OK]',
            '  attention.ko        [OK]',
            '  diffusion.ko        [OK]',
            '',
            'Mounting /dev/brain... done.',
            'Starting PETRE-OS...',
            ''
        ];

        var skipBoot = sessionStorage.getItem('petre-os-booted');

        function showDesktop() {
            bootScreen.style.display = 'none';
            desktop.classList.add('active');
            taskbar.classList.add('active');
            sessionStorage.setItem('petre-os-booted', '1');
            startClock();
            openWindow('win-about');
        }

        if (skipBoot) {
            showDesktop();
        } else {
            var lineIdx = 0;
            function typeLine() {
                if (lineIdx < bootLines.length) {
                    var line = document.createElement('div');
                    line.textContent = bootLines[lineIdx] || '\u00A0';
                    bootText.appendChild(line);
                    bootText.scrollTop = bootText.scrollHeight;
                    lineIdx++;
                    setTimeout(typeLine, bootLines[lineIdx - 1] === '' ? 200 : 60 + Math.random() * 80);
                } else {
                    setTimeout(showDesktop, 600);
                }
            }
            typeLine();
        }

        // ── Clock ────────────────────────────────────────────
        var clockEl = document.getElementById('taskbar-clock');
        function startClock() {
            function update() {
                var d = new Date();
                clockEl.textContent = d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
            }
            update();
            setInterval(update, 10000);
        }

        // ── Window management ────────────────────────────────
        var windows = document.querySelectorAll('.window');
        var zIndex = 10;
        var activeWindow = null;

        function focusWindow(win) {
            if (activeWindow) activeWindow.classList.remove('focused');
            win.classList.add('focused');
            win.style.zIndex = ++zIndex;
            activeWindow = win;
            updateTaskbar();
        }

        function openWindow(id) {
            var win = document.getElementById(id);
            if (!win) return;
            win.classList.add('open');
            win.classList.remove('minimized');
            focusWindow(win);
            // stagger position for newly opened windows
            if (!win.dataset.positioned) {
                var openCount = document.querySelectorAll('.window.open').length;
                var offsetX = 60 + ((openCount - 1) * 30);
                var offsetY = 40 + ((openCount - 1) * 30);
                win.style.left = offsetX + 'px';
                win.style.top = offsetY + 'px';
                win.dataset.positioned = '1';
            }
            updateTaskbar();
        }

        function closeWindow(id) {
            var win = document.getElementById(id);
            if (!win) return;
            win.classList.remove('open', 'focused', 'minimized');
            if (activeWindow === win) activeWindow = null;
            updateTaskbar();
        }

        function minimizeWindow(id) {
            var win = document.getElementById(id);
            if (!win) return;
            win.classList.add('minimized');
            if (activeWindow === win) activeWindow = null;
            updateTaskbar();
        }

        function updateTaskbar() {
            var tb = document.getElementById('taskbar-windows');
            tb.innerHTML = '';
            windows.forEach(function(win) {
                if (!win.classList.contains('open')) return;
                var btn = document.createElement('button');
                btn.className = 'taskbar-win-btn';
                if (win.classList.contains('focused') && !win.classList.contains('minimized')) {
                    btn.classList.add('active');
                }
                btn.textContent = win.querySelector('.window-title').textContent;
                btn.addEventListener('click', function() {
                    if (win.classList.contains('minimized')) {
                        win.classList.remove('minimized');
                        focusWindow(win);
                    } else if (win.classList.contains('focused')) {
                        minimizeWindow(win.id);
                    } else {
                        focusWindow(win);
                    }
                });
                tb.appendChild(btn);
            });
        }

        // ── Desktop icon clicks ──────────────────────────────
        document.querySelectorAll('.desktop-icon').forEach(function(icon) {
            icon.addEventListener('dblclick', function() {
                openWindow(this.dataset.window);
            });
            // mobile: single tap
            icon.addEventListener('touchend', function(e) {
                e.preventDefault();
                openWindow(this.dataset.window);
            });
        });

        // ── Window title bar buttons ─────────────────────────
        windows.forEach(function(win) {
            var titlebar = win.querySelector('.window-titlebar');
            var closeBtn = win.querySelector('.win-close');
            var minBtn = win.querySelector('.win-minimize');
            var maxBtn = win.querySelector('.win-maximize');

            titlebar.addEventListener('mousedown', function() {
                focusWindow(win);
            });

            closeBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                closeWindow(win.id);
            });

            minBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                minimizeWindow(win.id);
            });

            if (maxBtn) {
                maxBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    win.classList.toggle('maximized');
                });
            }

            // Click window body to focus
            win.addEventListener('mousedown', function() {
                focusWindow(win);
            });

            // ── Drag ─────────────────────────────────────────
            var dragging = false, dragX, dragY;
            titlebar.addEventListener('mousedown', function(e) {
                if (e.target.closest('.win-btn')) return;
                if (win.classList.contains('maximized')) return;
                dragging = true;
                dragX = e.clientX - win.offsetLeft;
                dragY = e.clientY - win.offsetTop;
                win.classList.add('dragging');
                e.preventDefault();
            });

            document.addEventListener('mousemove', function(e) {
                if (!dragging) return;
                win.style.left = (e.clientX - dragX) + 'px';
                win.style.top = (e.clientY - dragY) + 'px';
            });

            document.addEventListener('mouseup', function() {
                if (dragging) {
                    dragging = false;
                    win.classList.remove('dragging');
                }
            });
        });

        // ── Start menu ───────────────────────────────────────
        var startBtn = document.getElementById('start-btn');
        var startMenu = document.getElementById('start-menu');

        startBtn.addEventListener('click', function() {
            startMenu.classList.toggle('open');
        });

        document.addEventListener('click', function(e) {
            if (!startMenu.contains(e.target) && e.target !== startBtn && !startBtn.contains(e.target)) {
                startMenu.classList.remove('open');
            }
        });

        document.querySelectorAll('.start-menu-item[data-window]').forEach(function(item) {
            item.addEventListener('click', function() {
                openWindow(this.dataset.window);
                startMenu.classList.remove('open');
            });
        });

        document.getElementById('start-github').addEventListener('click', function() {
            window.open('https://github.com/simpetre', '_blank');
            startMenu.classList.remove('open');
        });
        document.getElementById('start-linkedin').addEventListener('click', function() {
            window.open('https://linkedin.com/in/simon.petre', '_blank');
            startMenu.classList.remove('open');
        });

        // ── Easter egg: type "adventure" to launch game ──────
        var secretBuffer = '';
        document.addEventListener('keydown', function(e) {
            // don't capture if typing in the adventure input
            if (e.target.id === 'adventure-input') return;
            secretBuffer += e.key.toLowerCase();
            if (secretBuffer.length > 20) secretBuffer = secretBuffer.slice(-20);
            if (secretBuffer.includes('adventure')) {
                secretBuffer = '';
                openWindow('win-adventure');
                setTimeout(function() {
                    document.getElementById('adventure-input').focus();
                }, 100);
            }
        });

        // ══════════════════════════════════════════════════════
        // ── ADVENTURE GAME ENGINE ────────────────────────────
        // ══════════════════════════════════════════════════════
        (function() {
            var output = document.getElementById('adventure-output');
            var input = document.getElementById('adventure-input');
            var inventory = [];
            var flags = {};
            var currentRoom = 'root';
            var moveCount = 0;

            var rooms = {
                root: {
                    name: '/root',
                    desc: 'You are in the root home directory. The hum of cooling fans fills the air. A blinking cursor awaits your command.\n\nThere is a dusty TERMINAL here. A NOTE is pinned to the wall.',
                    exits: { north: 'dev', east: 'var', south: 'opt', west: 'etc' },
                    items: ['note'],
                    look: {
                        terminal: 'An ancient CRT monitor glows green. It displays: "PETRE-OS v3.3 — Welcome, operator."',
                        note: 'The note reads: "The neural weights are scattered. Collect them all and bring them to /dev/brain to restore the system. Be warned: /etc is locked. — S.P."'
                    }
                },
                dev: {
                    name: '/dev/brain',
                    desc: 'The neural processing chamber. Massive banks of blinking lights line the walls. Thick cables snake across the floor. The central CONSOLE is dark — it needs power.\n\nA sign reads: "INSERT ALL 3 NEURAL WEIGHTS TO ACTIVATE."',
                    exits: { south: 'root', east: 'proc' },
                    items: [],
                    look: {
                        console: function() {
                            if (flags.brainActive) return 'The console hums with life. Streams of data cascade across the screen. You did it.';
                            var count = 0;
                            if (flags.weight1) count++;
                            if (flags.weight2) count++;
                            if (flags.weight3) count++;
                            return 'The console has 3 slots for neural weights. ' + count + '/3 installed.';
                        },
                        cables: 'Thick fiber optic cables pulse with faint green light. They connect to something deeper in the system.',
                        lights: 'Rows of blinking LEDs. Some patterns almost look like they\'re trying to communicate.'
                    }
                },
                proc: {
                    name: '/proc/threads',
                    desc: 'A narrow corridor of running processes. Numbers scroll endlessly on the walls. The air crackles with static.\n\nA frozen PROCESS blocks part of the passage. There is a WEIGHT_ALPHA on the floor.',
                    exits: { west: 'dev' },
                    items: ['weight_alpha'],
                    look: {
                        process: function() {
                            if (flags.processKilled) return 'The process has been terminated. Sparks still linger where it stood.';
                            return 'PID 8088 — status: FROZEN. It hums angrily. Maybe you can KILL it.';
                        },
                        numbers: 'Process IDs, memory addresses, CPU ticks... the lifeblood of the machine.',
                        weight_alpha: 'A glowing crystalline cube etched with neural pathways. It pulses faintly.'
                    }
                },
                var: {
                    name: '/var/log',
                    desc: 'The logging chamber. Endless scrolls of text cascade down the walls like waterfalls. The air smells of old paper and ozone.\n\nA WEIGHT_BETA sits on a dusty shelf. An old LOG_BOOK lies open on a table.',
                    exits: { west: 'root', north: 'tmp' },
                    items: ['weight_beta'],
                    look: {
                        log_book: 'The last entry reads: "Day 2847. The system grows quiet. I\'ve hidden the access key in /tmp before it degrades. Hurry. — S.P."',
                        text: 'Error logs, access logs, kernel messages... years of machine history scrolling past.',
                        shelf: 'A metal shelf bolted to the wall. Covered in digital dust.',
                        weight_beta: 'A glowing crystalline cube. This one hums at a slightly different frequency than the others.'
                    }
                },
                tmp: {
                    name: '/tmp',
                    desc: 'A volatile space. Things flicker in and out of existence here. The walls themselves seem unstable, shifting between solid and transparent.\n\nA KEYCARD materializes briefly on a pedestal before flickering.',
                    exits: { south: 'var' },
                    items: ['keycard'],
                    look: {
                        pedestal: 'A small stone pedestal. Things placed here tend to vanish after a while.',
                        walls: 'They shimmer and phase — the nature of temporary storage. Nothing here lasts.',
                        keycard: 'A translucent access card. Text reads: "/etc ACCESS — LEVEL 5 CLEARANCE"'
                    }
                },
                opt: {
                    name: '/opt/models',
                    desc: 'The model repository. Glass cases line the walls, each containing a different trained model. Most are dormant.\n\nA large TRANSFORMER model dominates the center of the room, encased in amber light.',
                    exits: { north: 'root' },
                    items: [],
                    look: {
                        transformer: 'A magnificent architecture of attention heads and feed-forward layers, frozen mid-inference. A plaque reads: "GPT class — 175B parameters. DO NOT TOUCH."',
                        cases: 'You see labels: "ResNet-50", "BERT-base", "Stable Diffusion v1.5", "YOLOv8"... relics of another era.',
                        models: 'Dozens of neural architectures, each a crystallized intelligence. They wait silently for someone to call inference.'
                    }
                },
                etc: {
                    name: '/etc/secrets',
                    desc: function() {
                        if (!inventory.includes('keycard') && !flags.etcUnlocked) return null; // can't enter
                        flags.etcUnlocked = true;
                        return 'A hidden vault. The air is cold and still. Rows of encrypted files glow behind reinforced glass.\n\nA WEIGHT_GAMMA floats in a containment field at the center of the room.';
                    },
                    exits: { east: 'root' },
                    items: ['weight_gamma'],
                    look: {
                        files: 'Encrypted configuration files. SSH keys, API tokens, ancient passwords... the system\'s deepest secrets.',
                        field: 'A magnetic containment field suspends the neural weight in mid-air. It rotates slowly.',
                        weight_gamma: 'The final neural weight. It glows brighter than the others, as if eager to complete the circuit.'
                    },
                    locked: true
                }
            };

            var itemNames = {
                note: 'a crumpled NOTE',
                weight_alpha: 'WEIGHT_ALPHA (neural weight 1/3)',
                weight_beta: 'WEIGHT_BETA (neural weight 2/3)',
                weight_gamma: 'WEIGHT_GAMMA (neural weight 3/3)',
                keycard: 'an ACCESS KEYCARD'
            };

            function print(text, cls) {
                var div = document.createElement('div');
                div.className = cls || 'adv-action';
                div.textContent = text;
                output.appendChild(div);
                output.scrollTop = output.scrollHeight;
            }

            function printRoom() {
                var room = rooms[currentRoom];
                var desc = typeof room.desc === 'function' ? room.desc() : room.desc;
                print(room.name, 'adv-room');
                desc.split('\n').forEach(function(line) {
                    print(line, 'adv-desc');
                });
                var exits = Object.keys(room.exits);
                print('Exits: ' + exits.join(', '), 'adv-desc');
            }

            function doCommand(cmd) {
                cmd = cmd.trim().toLowerCase();
                if (!cmd) return;
                print(cmd, 'adv-input-echo');
                moveCount++;

                var parts = cmd.split(/\s+/);
                var verb = parts[0];
                var noun = parts.slice(1).join('_');
                var room = rooms[currentRoom];

                // ── Movement ──
                var dirs = { n: 'north', s: 'south', e: 'east', w: 'west', north: 'north', south: 'south', east: 'east', west: 'west' };
                if (verb === 'go' && dirs[noun]) verb = dirs[noun];
                if (dirs[verb]) {
                    var dir = dirs[verb];
                    if (room.exits[dir]) {
                        var dest = rooms[room.exits[dir]];
                        // check locked
                        if (dest.locked && !flags.etcUnlocked) {
                            if (inventory.includes('keycard')) {
                                print('You swipe the KEYCARD. The lock disengages with a heavy clank.', 'adv-action');
                                flags.etcUnlocked = true;
                            } else {
                                print('The door is locked. You need some kind of access card.', 'adv-error');
                                return;
                            }
                        }
                        var descCheck = typeof dest.desc === 'function' ? dest.desc() : dest.desc;
                        if (descCheck === null) {
                            print('The door is locked. You need some kind of access card.', 'adv-error');
                            return;
                        }
                        currentRoom = room.exits[dir];
                        print('', 'adv-desc');
                        printRoom();
                    } else {
                        print('You can\'t go that way.', 'adv-error');
                    }
                    return;
                }

                // ── Look ──
                if (verb === 'look' || verb === 'l' || verb === 'examine' || verb === 'x') {
                    if (!noun) {
                        print('', 'adv-desc');
                        printRoom();
                        return;
                    }
                    if (room.look && room.look[noun]) {
                        var desc = room.look[noun];
                        print(typeof desc === 'function' ? desc() : desc, 'adv-desc');
                    } else {
                        print('You don\'t see that here.', 'adv-error');
                    }
                    return;
                }

                // ── Take / Get ──
                if (verb === 'take' || verb === 'get' || verb === 'grab' || verb === 'pick') {
                    if (noun === 'up' && parts.length > 2) noun = parts.slice(2).join('_');
                    if (room.items && room.items.includes(noun)) {
                        room.items.splice(room.items.indexOf(noun), 1);
                        inventory.push(noun);
                        print('Taken: ' + (itemNames[noun] || noun), 'adv-item');
                    } else {
                        print('You can\'t take that.', 'adv-error');
                    }
                    return;
                }

                // ── Inventory ──
                if (verb === 'inventory' || verb === 'inv' || verb === 'i') {
                    if (inventory.length === 0) {
                        print('You\'re not carrying anything.', 'adv-desc');
                    } else {
                        print('You are carrying:', 'adv-desc');
                        inventory.forEach(function(item) {
                            print('  ' + (itemNames[item] || item), 'adv-item');
                        });
                    }
                    return;
                }

                // ── Use / Install ──
                if (verb === 'use' || verb === 'install' || verb === 'insert' || verb === 'place') {
                    if (currentRoom === 'dev' && (noun.indexOf('weight') !== -1 || noun === 'all' || noun === 'weights')) {
                        var installed = false;
                        var toInstall = noun === 'all' || noun === 'weights'
                            ? ['weight_alpha', 'weight_beta', 'weight_gamma']
                            : [noun];
                        toInstall.forEach(function(w) {
                            if (inventory.includes(w)) {
                                inventory.splice(inventory.indexOf(w), 1);
                                flags[w === 'weight_alpha' ? 'weight1' : w === 'weight_beta' ? 'weight2' : 'weight3'] = true;
                                print('Installed ' + (itemNames[w] || w) + ' into the console.', 'adv-item');
                                installed = true;
                            }
                        });
                        if (!installed) {
                            print('You don\'t have that.', 'adv-error');
                            return;
                        }
                        if (flags.weight1 && flags.weight2 && flags.weight3) {
                            print('', 'adv-desc');
                            print('The console roars to life. Light floods the chamber.', 'adv-special');
                            print('Neural pathways reconnect — billions of parameters', 'adv-special');
                            print('surge through the system. The brain is ONLINE.', 'adv-special');
                            print('', 'adv-desc');
                            print('PETRE-OS is fully restored. The machine thinks again.', 'adv-special');
                            print('', 'adv-desc');
                            print('Congratulations! You completed the adventure in ' + moveCount + ' moves.', 'adv-special');
                            print('', 'adv-desc');
                            print('Type RESTART to play again.', 'adv-desc');
                            flags.brainActive = true;
                        }
                    } else {
                        print('You can\'t use that here.', 'adv-error');
                    }
                    return;
                }

                // ── Kill (for the frozen process) ──
                if (verb === 'kill') {
                    if (currentRoom === 'proc' && (noun === 'process' || noun === '8088' || noun === 'pid')) {
                        if (flags.processKilled) {
                            print('It\'s already dead.', 'adv-desc');
                        } else {
                            print('$ kill -9 8088', 'adv-input-echo');
                            print('Process 8088 terminated. The passage clears.', 'adv-action');
                            flags.processKilled = true;
                        }
                    } else {
                        print('Kill what?', 'adv-error');
                    }
                    return;
                }

                // ── Restart ──
                if (verb === 'restart') {
                    inventory = [];
                    flags = {};
                    currentRoom = 'root';
                    moveCount = 0;
                    // reset room items
                    rooms.root.items = ['note'];
                    rooms.proc.items = ['weight_alpha'];
                    rooms.var.items = ['weight_beta'];
                    rooms.tmp.items = ['keycard'];
                    rooms.etc.items = ['weight_gamma'];
                    output.innerHTML = '';
                    startGame();
                    return;
                }

                // ── Help ──
                if (verb === 'help' || verb === '?') {
                    print('Commands: go [n/s/e/w], look [thing], take [item],', 'adv-desc');
                    print('  inventory, use [item], kill [target], help, restart', 'adv-desc');
                    return;
                }

                // ── Sudo ──
                if (verb === 'sudo') {
                    print('Nice try. You\'re already root.', 'adv-action');
                    return;
                }

                // ── Misc ──
                if (verb === 'xyzzy') {
                    print('A hollow voice says "Fool."', 'adv-desc');
                    return;
                }

                print('I don\'t understand "' + cmd + '". Type HELP for commands.', 'adv-error');
            }

            function startGame() {
                print('PETRE-OS ADVENTURE v1.0', 'adv-special');
                print('A text adventure by PETRE-OS Systems Inc.', 'adv-desc');
                print('Type HELP for commands.', 'adv-desc');
                print('', 'adv-desc');
                printRoom();
            }

            // Start game when window first opens
            var gameStarted = false;
            var observer = new MutationObserver(function() {
                var win = document.getElementById('win-adventure');
                if (win.classList.contains('open') && !gameStarted) {
                    gameStarted = true;
                    startGame();
                    setTimeout(function() {
                        input.focus();
                    }, 50);
                }
            });
            observer.observe(document.getElementById('win-adventure'), { attributes: true, attributeFilter: ['class'] });

            input.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    doCommand(input.value);
                    input.value = '';
                }
            });

            // Focus input when clicking the adventure window body
            document.querySelector('.adventure-body').addEventListener('click', function() {
                input.focus();
            });
        })();

    })();
    </script>
