<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ site.description }}">
    <title>{{ page.title | default: site.title }}</title>
    <link rel="stylesheet" href="{{ site.baseurl }}/css/main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <noscript><style>[data-animate],[data-animate-children]>*{opacity:1!important;transform:none!important}</style></noscript>
</head>

<body>

    <nav class="top-nav">
        <div class="nav-inner">
            <a class="nav-logo" href="#hero">{{ site.title }}</a>
            <ul class="nav-links">
                <li><a href="#about">About</a></li>
                <li><a href="#skills">Skills</a></li>
                <li><a href="#projects">Projects</a></li>
                <li><a href="#experience">Experience</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </div>
    </nav>

    {{ content }}

    <script>
    (function() {
        // ── Force scroll to top on page load ─────────────────
        if (window.location.hash === '' || window.location.hash === '#hero') {
            window.scrollTo(0, 0);
            if ('scrollRestoration' in history) {
                history.scrollRestoration = 'manual';
            }
        }

        // ── Scroll-triggered reveal ──────────────────────────
        var animEls = document.querySelectorAll('[data-animate], [data-animate-children]');

        if ('IntersectionObserver' in window) {
            var revealObs = new IntersectionObserver(function(entries) {
                entries.forEach(function(entry) {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                        revealObs.unobserve(entry.target);
                    }
                });
            }, {
                threshold: 0.15,
                rootMargin: '0px 0px -40px 0px'
            });

            animEls.forEach(function(el) { revealObs.observe(el); });
        } else {
            animEls.forEach(function(el) { el.classList.add('visible'); });
        }

        // ── Active nav link highlighting ─────────────────────
        var sections = document.querySelectorAll('section[id]');
        var navLinks = document.querySelectorAll('.nav-links a');

        if ('IntersectionObserver' in window && sections.length) {
            var navObs = new IntersectionObserver(function(entries) {
                entries.forEach(function(entry) {
                    if (entry.isIntersecting) {
                        var id = entry.target.getAttribute('id');
                        navLinks.forEach(function(link) {
                            link.classList.toggle('active', link.getAttribute('href') === '#' + id);
                        });
                    }
                });
            }, {
                threshold: 0.3,
                rootMargin: '-60px 0px -40% 0px'
            });

            sections.forEach(function(s) { navObs.observe(s); });
        }
    })();
    </script>

    {% include analytics.html %}
</body>

</html>
