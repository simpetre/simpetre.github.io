<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ site.description }}">
    <title>{{ page.title | default: site.title }}</title>
    <link rel="icon" type="image/svg+xml" href="{{ site.baseurl }}/favicon.svg">
    <link rel="icon" type="image/x-icon" href="{{ site.baseurl }}/favicon.ico">
    <link rel="stylesheet" href="{{ site.baseurl }}/css/main.css?v={{ site.github.build_revision | default: site.time | date: '%s' }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>

<body>

    <!-- CRT power-on flash (removed by JS once it plays) -->
    <div id="power-on"></div>

    <!-- Matrix rain: idle screensaver / `matrix` command -->
    <canvas id="matrix-rain"></canvas>

    <!-- Global CRT overlays (one physical monitor) -->
    <div class="crt-rollbar"></div>
    <div class="crt-scanlines"></div>
    <div class="crt-vignette"></div>

    <div id="crt">

        <!-- Boot sequence -->
        <div id="boot-screen">
            <div id="boot-text"></div>
            <div class="boot-skip" id="boot-skip">[ press any key to skip ]</div>
        </div>

        <!-- The terminal -->
        <div id="terminal">
            <div id="term-header">
                <span class="th-user">simon@petre-os</span>
                <span class="th-title">~ &mdash; bash</span>
                <span class="th-right"><span class="th-dot">&#9679;</span> online <span id="term-clock"></span></span>
            </div>

            <div id="term-output"></div>

            <div id="term-menu">
                <button class="chip" data-cmd="about">about</button>
                <button class="chip" data-cmd="skills">skills</button>
                <button class="chip" data-cmd="projects">projects</button>
                <button class="chip" data-cmd="experience">experience</button>
                <button class="chip" data-cmd="education">education</button>
                <button class="chip" data-cmd="contact">contact</button>
                <button class="chip" data-cmd="resume">resume</button>
                <button class="chip" data-cmd="help">help</button>
                <button class="chip chip-play" data-cmd="adventure">adventure</button>
            </div>

            <div id="term-inputline">
                <span id="term-prompt">simon@petre<span class="ip-tilde">:~$</span></span>
                <input type="text" id="term-input" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="terminal input">
            </div>
        </div>

    </div>

    {{ content }}

    <script>
    (function() {

        // ══════════════════════════════════════════════════════
        // ADVENTURE ENGINE v3.0 — driven by the shell (see below)
        // ══════════════════════════════════════════════════════
        var ADVENTURE = (function() {
            var output = document.getElementById('term-output');
            var input = document.getElementById('term-input');
            var inventory = [];
            var flags = {};
            var currentRoom = 'root';
            var moveCount = 0;
            var visited = { root: true };
            var STORAGE_KEY = 'petre-os-adv-save';

            // Helper: check if item is in current room
            function roomHas(item) { return rooms[currentRoom].items.indexOf(item) !== -1; }
            function has(item) { return inventory.indexOf(item) !== -1; }
            function weightCount() { return (flags.weight1?1:0) + (flags.weight2?1:0) + (flags.weight3?1:0); }
            function puzzleCount() {
                return (flags.firewall_solved?1:0) + (flags.cipher_solved?1:0) + (flags.containment_solved?1:0) + (flags.usrSolved?1:0);
            }
            function secretCount() {
                return (flags.touchedTransformer?1:0) + (flags.heartFound?1:0) + (flags.readFloppy?1:0);
            }
            function computeRank() {
                var score = 0;
                if (flags.brainActive) score += 100;
                score += (typeof visited === 'object' ? Object.keys(visited).length : 0) * 6;
                score += puzzleCount() * 15;
                score += secretCount() * 20;
                score -= Math.floor(moveCount / 6);
                if (score < 0) score = 0;
                var rank;
                if (flags.brainActive && flags.heartFound && flags.readFloppy && score >= 230) rank = 'KERNEL WHISPERER (S+)';
                else if (score >= 200) rank = 'SENIOR OPERATOR (S)';
                else if (score >= 150) rank = 'SYSTEM ENGINEER (A)';
                else if (score >= 100) rank = 'JUNIOR SYSADMIN (B)';
                else if (score >= 50) rank = 'INTERN (C)';
                else rank = 'SCRIPT KIDDIE (D)';
                return { score: score, rank: rank };
            }

            var rooms = {
                root: {
                    name: '/root',
                    desc: function() {
                        var lines = ['You are in the root home directory of PETRE-OS. The hum of cooling fans fills the air. A green cursor blinks patiently on a dusty TERMINAL.'];
                        if (roomHas('note')) lines.push('\nA NOTE is pinned to the wall with a bent nail.');
                        else lines.push('\nA bent nail sticks out of the wall where a note used to be.');
                        lines.push('\nA COFFEE_MUG sits on the desk, still warm somehow.');
                        lines.push('\nIn the corner, a TOILET. Because even /root needs one.');
                        return lines.join('');
                    },
                    exits: { north: 'dev', east: 'var', south: 'opt', west: 'etc', down: 'devnull' },
                    items: ['note', 'coffee_mug'],
                    look: {
                        terminal: function() {
                            if (flags.brainActive) return 'The terminal displays: "ALL SYSTEMS NOMINAL. Thank you, operator."';
                            return 'An ancient CRT monitor glows green. It displays:\n"PETRE-OS v3.3 — WARNING: Neural subsystem offline.\nRestore all 3 weights to /dev/brain to reboot."';
                        },
                        note: function() {
                            if (!roomHas('note') && !has('note')) return 'The note is gone. Just a bent nail.';
                            return 'The note reads:\n"The neural weights are scattered across the filesystem. Collect all three and install them in /dev/brain. The vault at /etc is locked — you\'ll need to find access. Watch out for /dev/null.\n— S.P.\nP.S. Don\'t touch the transformer."';
                        },
                        coffee_mug: function() {
                            if (!roomHas('coffee_mug') && !has('coffee_mug')) return 'You already took that.';
                            return 'A ceramic mug that reads "World\'s #1 Kernel Hacker." The coffee inside defies thermodynamics — still steaming after what appears to be decades.';
                        },
                        desk: 'A metal desk covered in ring stains and faded sticky notes. One reads: "chmod 777 /heart".',
                        nail: 'A bent nail in the wall. Industrial-grade sysadmin interior design.',
                        fans: 'Somewhere behind the walls, fans spin endlessly. They\'ve been running since the epoch.',
                        toilet: 'A standard-issue PETRE-OS porcelain terminal. There\'s a roll of TOILET_PAPER mounted on the wall next to it.',
                        toilet_paper: 'The label reads: "Your Mate Rick\'s Multi-ply — For All Your Dense Operations."'
                    }
                },
                dev: {
                    name: '/dev/brain',
                    desc: function() {
                        if (flags.brainActive) return 'The neural processing chamber is alive. Light pulses through every cable, every conduit. The CONSOLE streams data faster than you can read. The air hums with intelligence.\n\nYou feel like the machine is watching you. Gratefully.';
                        var lines = ['The neural processing chamber. Massive banks of dead LIGHTS line the walls. Thick CABLES snake across the floor like sleeping serpents. The central CONSOLE sits dark and silent.'];
                        var wc = weightCount();
                        if (wc > 0) lines.push('\nThe console has ' + wc + '/3 neural weights installed. ' + (wc < 3 ? 'It needs more.' : ''));
                        else lines.push('\nA sign reads: "INSERT ALL 3 NEURAL WEIGHTS TO ACTIVATE."');
                        if (roomHas('floppy')) lines.push('\nA FLOPPY disk has been ejected from a slot you didn\'t notice before.');
                        lines.push('\nA maintenance ladder leads NORTH to /usr/bin, where the system tools live.');
                        return lines.join('');
                    },
                    exits: { south: 'root', east: 'proc', north: 'usr' },
                    items: [],
                    look: {
                        console: function() {
                            if (flags.brainActive) return 'Streams of data cascade across the screen. You see fragments:\n"Loading consciousness... done.\nRecalling memories... 2,847 days of logs recovered.\nThank you for waking me up."\nA FLOPPY disk ejects from a slot.';
                            var wc = weightCount();
                            return 'The console has 3 hexagonal slots for neural weights. ' + wc + '/3 are filled.' + (wc === 0 ? ' The slots glow faintly, waiting.' : ' The installed weights pulse in sync.');
                        },
                        cables: 'Thick fiber optic cables, dark and cold. When you touch one, you feel a faint vibration — something waiting to flow.',
                        lights: function() {
                            if (flags.brainActive) return 'The lights are alive now — cascading patterns of green that look almost like thoughts.';
                            return 'Dead LEDs. Thousands of them. They haven\'t blinked in a very long time.';
                        },
                        sign: 'Brass plaque, bolted to the wall: "NEURAL PROCESSING UNIT — Est. Day 0"',
                        floppy: function() {
                            if (!roomHas('floppy')) return 'You already took that.';
                            if (!flags.brainActive) return 'You don\'t see a floppy disk here.';
                            return 'A 3.5" floppy disk. The label reads: "THANK_YOU.txt — For the operator who brought me back."';
                        }
                    }
                },
                proc: {
                    name: '/proc/threads',
                    desc: function() {
                        var lines = ['A narrow corridor lined with running processes. Numbers scroll endlessly on the WALLS. The air crackles with static electricity.'];
                        if (!flags.processKilled) {
                            lines.push('\nA massive frozen PROCESS blocks most of the passage, crackling with unstable energy. Behind it, you can see a WEIGHT_ALPHA on the floor, just out of reach.');
                        } else if (!flags.firewall_solved && roomHas('weight_alpha')) {
                            lines.push('\nScorch marks on the floor where the frozen process used to be.');
                            lines.push('\nA FIREWALL terminal has activated in front of the WEIGHT_ALPHA. Its screen glows with a question, waiting for an ANSWER.');
                        } else {
                            lines.push('\nScorch marks on the floor where the frozen process used to be. Sparks still occasionally pop from the residue.');
                            if (roomHas('weight_alpha')) lines.push('\nA WEIGHT_ALPHA sits on the floor, now accessible.');
                        }
                        return lines.join('');
                    },
                    exits: { west: 'dev' },
                    items: ['weight_alpha'],
                    look: {
                        process: function() {
                            if (flags.processKilled) return 'Just scorch marks and the smell of burnt silicon. R.I.P. PID 8088.';
                            return 'PID 8088 — status: FROZEN. A runaway garbage collector from 2019. It buzzes angrily and throws sparks when you get close. You\'ll need to KILL it to get past.';
                        },
                        firewall: function() {
                            if (!flags.processKilled) return 'You can\'t see past the frozen process.';
                            if (flags.firewall_solved) return 'The firewall terminal is dark. "ACCESS GRANTED" still glows faintly on the screen.';
                            return 'FIREWALL v2.1 — IDENTITY CHECK\n\n"A neural network\'s weights are updated by subtracting\nthe product of the learning rate and the _____ of the\nloss function."\n\nType: answer [your answer]';
                        },
                        walls: 'Process IDs stream past like the matrix:\n  PID 42    — init         [sleeping]\n  PID 1337  — hackerd      [running]\n  PID 8088  — gc_worker    [FROZEN]\n  PID 80085 — boobsd       [???]',
                        weight_alpha: function() {
                            if (!roomHas('weight_alpha')) return 'You already took that.';
                            if (!flags.processKilled) return 'You can see it behind the frozen process — a glowing crystalline cube. You can\'t reach it while that thing is in the way.';
                            if (!flags.firewall_solved) return 'The weight glows behind the FIREWALL terminal. You need to answer its question first.';
                            return 'A glowing crystalline cube etched with neural pathways. It pulses warmly, like a heartbeat.';
                        },
                        sparks: 'Little arcs of electricity jump between the walls. Probably fine. Probably.',
                        static: 'Your hair stands on end. The air tastes like batteries.'
                    }
                },
                var: {
                    name: '/var/log',
                    desc: function() {
                        var lines = ['The logging chamber. Endless scrolls of text cascade down the WALLS like waterfalls of history. The air smells of old paper and ozone. A TABLE sits in the center.'];
                        if (roomHas('weight_beta') && !flags.cipher_solved) {
                            lines.push('\nA WEIGHT_BETA is visible on the SHELF, but it\'s encased in a LOG_CIPHER — a cryptographic lock pulsing with dim light. It demands an ANSWER.');
                        } else if (roomHas('weight_beta')) {
                            lines.push('\nA WEIGHT_BETA sits freed on the SHELF, ready to take.');
                        } else {
                            lines.push('\nThe SHELF is empty except for some dusty printouts.');
                        }
                        lines.push('\nAn old LOG_BOOK lies open on the table.');
                        return lines.join('');
                    },
                    exits: { west: 'root', north: 'tmp' },
                    items: ['weight_beta'],
                    look: {
                        log_book: 'The last entries read:\n  "Day 2844: Memory leaks worsening. The brain is forgetting."\n  "Day 2845: Scattered the weights. Too dangerous to keep together."\n  "Day 2846: Hid the access key in /tmp before it degrades."\n  "Day 2847: If you\'re reading this — hurry. — S.P."',
                        walls: 'Error logs scroll eternally:\n  [WARN] neural_cortex: connection timeout\n  [ERR]  memory_pool: segfault at 0xDEADBEEF\n  [WARN] consciousness: daemon not responding\n  [INFO] hope: still running',
                        log_cipher: function() {
                            if (flags.cipher_solved) return 'The cipher is broken. Just a dead husk of encryption now.';
                            if (!roomHas('weight_beta')) return 'The cipher dissolved when you solved it.';
                            return 'LOG_CIPHER — DECRYPT TO RELEASE\n\n"I map any real number to a value between 0 and 1.\nI\'m shaped like an S. Neural networks use me to\nsquash their outputs. What function am I?"\n\nType: answer [your answer]';
                        },
                        cipher: function() { return rooms.var.look.log_cipher(); },
                        shelf: function() {
                            if (roomHas('weight_beta') && !flags.cipher_solved) return 'A metal shelf bolted to the wall. The weight is trapped inside a LOG_CIPHER — examine it.';
                            if (roomHas('weight_beta')) return 'A metal shelf bolted to the wall. The freed weight glows gently.';
                            return 'A metal shelf. Just dusty printouts now. One reads: "TODO: fix the universe."';
                        },
                        weight_beta: function() {
                            if (!roomHas('weight_beta')) return 'You already took that.';
                            if (!flags.cipher_solved) return 'It\'s locked inside the LOG_CIPHER. You need to answer the cipher\'s question first.';
                            return 'A glowing crystalline cube, slightly different from the others — this one hums at a lower frequency. It feels heavier, like it carries memories.';
                        },
                        table: 'A sturdy metal table. Someone carved "I WAS HERE — PID 1" into the surface.',
                        printouts: 'Stack traces, core dumps, and one coupon for a free coffee at /root. Expired.'
                    }
                },
                tmp: {
                    name: '/tmp',
                    desc: function() {
                        var lines = ['A volatile space. Things FLICKER in and out of existence. The WALLS shimmer between solid and transparent. Your own hands look slightly translucent here.'];
                        if (roomHas('keycard')) lines.push('\nA KEYCARD materializes on a PEDESTAL, flickering but stable enough to grab — for now.');
                        else lines.push('\nThe PEDESTAL is empty. Everything in /tmp is temporary, after all.');
                        if (flags.leftCoffeeInTmp) lines.push('\nYour coffee mug is gone. Of course it is. This is /tmp.');
                        lines.push('\nTo the NORTH, a cable snakes up into a mounted SATELLITE dish humming with uplink traffic — /mnt/net.');
                        return lines.join('');
                    },
                    exits: { south: 'var', north: 'net' },
                    items: ['keycard'],
                    look: {
                        pedestal: function() {
                            if (roomHas('keycard')) return 'A small stone pedestal that seems to be the only solid thing in the room. The keycard hovers just above its surface.';
                            return 'Empty. A faint outline where the keycard used to be, already fading.';
                        },
                        walls: 'They shimmer and phase — you can almost see through them to... nothing. Just void. The nature of temporary storage.',
                        keycard: function() {
                            if (!roomHas('keycard')) return 'It\'s gone. Claimed or decayed — hard to tell in /tmp.';
                            return 'A translucent access card, flickering slightly. Text reads:\n"/etc ACCESS — LEVEL 5 CLEARANCE\nWARNING: This item will not persist."';
                        },
                        flicker: 'Everything here has a half-life. Files appear and vanish. You see ghost images of things that were: a half-written config file, someone\'s forgotten SSH key, a cat picture.',
                        hands: 'Your hands are slightly see-through. Unsettling. Don\'t stay too long.'
                    }
                },
                opt: {
                    name: '/opt/models',
                    desc: function() {
                        var lines = ['The model repository. Glass CASES line the walls, each containing a different trained model. Most are dormant, suspended in inference limbo.'];
                        lines.push('\nA massive TRANSFORMER model dominates the center of the room, encased in a column of light. A plaque reads: "DO NOT TOUCH."');
                        if (flags.touchedTransformer) lines.push('\nThe glass case around the transformer has a hand-shaped scorch mark on it.');
                        lines.push('\nA doorway to the EAST is marked "/home/simon" in warm, hand-painted letters — the only thing in here that isn\'t sterile.');
                        return lines.join('');
                    },
                    exits: { north: 'root', east: 'home' },
                    items: [],
                    look: {
                        transformer: function() {
                            if (flags.touchedTransformer) return 'The transformer stares at you reproachfully. Well, as much as a mathematical architecture can stare. You can still feel the tingle in your fingertips.';
                            return 'A magnificent architecture of attention heads and feed-forward layers, frozen mid-inference. 96 layers of pure reasoning.\n\nThe plaque reads: "GPT class — 175B parameters. DO NOT TOUCH.\nSeriously. We mean it."';
                        },
                        cases: 'You see labels:\n  "ResNet-50"    — gathering dust\n  "BERT-base"    — looks confused\n  "Stable Diff."  — dreaming, probably\n  "YOLOv8"       — staring at you\n  "GPT-2"        — scribbling madly on the inside of its case',
                        plaque: 'It reads: "DO NOT TOUCH." Someone scratched "i touched it — PID 1337" underneath.',
                        models: 'Dozens of neural architectures, each a crystallized intelligence. They wait silently. One of them — you can\'t tell which — seems to be whispering.',
                        light: 'The column of light around the transformer pulses gently. It\'s warm if you stand close enough. Like standing near a very smart campfire.'
                    }
                },
                etc: {
                    name: '/etc/secrets',
                    desc: function() {
                        if (!has('keycard') && !flags.etcUnlocked) return null;
                        flags.etcUnlocked = true;
                        var lines = ['A hidden vault. The air is cold and perfectly still. Rows of encrypted FILES glow behind reinforced glass. This is where the system keeps its deepest secrets.'];
                        if (roomHas('weight_gamma') && !flags.containment_solved) {
                            lines.push('\nA WEIGHT_GAMMA floats in a magnetic CONTAINMENT field at the center of the room. A CONSOLE next to it demands final clearance — an ANSWER to release the lock.');
                        } else if (roomHas('weight_gamma')) {
                            lines.push('\nA WEIGHT_GAMMA floats free, the containment field deactivated. Ready to take.');
                        } else {
                            lines.push('\nThe containment field is empty, its hum slightly lower without a payload.');
                        }
                        lines.push('\nA SHADOW_FILE pulses in the corner — something that probably shouldn\'t be here.');
                        return lines.join('');
                    },
                    exits: { east: 'root' },
                    items: ['weight_gamma'],
                    look: {
                        files: 'Behind the glass:\n  .ssh/id_rsa          [ENCRYPTED]\n  passwords.txt        [ENCRYPTED]\n  api_keys.env         [ENCRYPTED]\n  todo_2019.txt        [CORRUPTED]\n  feelings.log         [ACCESS DENIED]',
                        console: function() {
                            if (flags.containment_solved) return 'The console reads: "CLEARANCE GRANTED." The containment field is down.';
                            if (!roomHas('weight_gamma')) return 'The console is dark. Its job is done.';
                            return 'CONTAINMENT LOCK — FINAL CLEARANCE\n\n"In a transformer, after computing attention scores,\nthey are divided by the square root of this value\nbefore applying softmax. What is being divided by?"\n\nType: answer [your answer]';
                        },
                        containment: function() {
                            if (roomHas('weight_gamma') && !flags.containment_solved) return 'A magnetic containment field suspends the neural weight in mid-air. The CONSOLE next to it controls the lock.';
                            if (roomHas('weight_gamma')) return 'The containment field is down. The weight floats gently, free to take.';
                            return 'The containment field hums softly, empty now. A faint green afterimage traces where the weight used to spin.';
                        },
                        weight_gamma: function() {
                            if (!roomHas('weight_gamma')) return 'You already took it.';
                            if (!flags.containment_solved) return 'The final weight spins inside the containment field. The CONSOLE must be answered to release it.';
                            return 'The final neural weight. It glows brighter than the others, almost urgently, as if it knows it\'s the last piece. When you look closely, you can see data streaming through its crystalline lattice.';
                        },
                        shadow_file: 'A pulsing, semi-transparent file. You can barely make out its contents:\n"I remember when the system was whole. When thoughts flowed freely through /dev/brain. Bring the weights back. Please."\nIt\'s signed by no one.',
                        glass: 'Reinforced. You\'re not getting through this without a quantum lockpick. Or a really good sudo.'
                    },
                    locked: true
                },
                devnull: {
                    name: '/dev/null',
                    desc: function() {
                        return 'The void. Absolute nothing stretches in every direction. Sound dies here. Light barely exists. This is where data comes to be forgotten.\n\nThere is no floor — you\'re standing on something, but you can\'t see what. Looking down is a mistake.\n\nThe only exit is UP.';
                    },
                    exits: { up: 'root' },
                    items: [],
                    look: {
                        void: 'You stare into the void. The void does not stare back. The void doesn\'t care about you at all.',
                        floor: 'DON\'T LOOK DOWN. Oh, you looked. It\'s... nothing. An absence of everything. Your stomach lurches.',
                        nothing: 'Exactly.',
                        darkness: 'It\'s not dark, exactly. Darkness implies the absence of light. This is the absence of absence. It\'s worse.'
                    }
                },
                usr: {
                    name: '/usr/bin',
                    desc: function() {
                        var lines = ['The tool shed. Every command-line utility PETRE-OS has ever installed hangs on pegboards or dozes in bins. A grizzled GREP hound sniffs the floor. SED and AWK play cards in the corner, ignoring you completely.'];
                        lines.push('\nA dusty WHITEBOARD on the wall has a challenge scrawled on it, half-erased. It looks like a RIDDLE.');
                        if (flags.usrSolved) lines.push('\nUnder the whiteboard, a small brass MULTITOOL glints — your reward for solving the riddle.');
                        return lines.join('');
                    },
                    exits: { south: 'dev' },
                    items: [],
                    look: {
                        whiteboard: function() {
                            if (flags.usrSolved) return 'The whiteboard reads "SOLVED. Nice one." in fresh ink.';
                            return 'THE /usr/bin RIDDLE\n\n"I halve the search space with every guess,\nfinding any sorted needle in log-time, no less.\nMy Big-O notation is my calling card.\nName my time complexity — and don\'t think too hard."\n\nType: answer [your answer]  (e.g. answer O(log n))';
                        },
                        grep: 'The GREP hound wags its tail and drops a matching line at your feet: "found 1 result: a very good dog". It has been searching for a pattern its whole life. You suspect the pattern is "love".',
                        sed: 'SED looks up from the card game. "s/you/gone/g," it mutters, and for a dizzying second you feel replaced. Then you\'re back. AWK snickers.',
                        awk: 'AWK deals another hand, splitting the deck on whitespace. "Field $3 is a jack," it announces to no one. It is very good at exactly one thing.',
                        vim: 'A door labeled VIM. You open it. You cannot figure out how to close it. You leave it open forever, like everyone does.',
                        tools: 'Pegboards of utilities: curl, tar, chmod, kill, ping, htop. Each hums with a quiet, single-minded competence. chmod, in particular, seems to be watching /root... something about a heart.',
                        multitool: function() {
                            if (!flags.usrSolved) return 'You don\'t see a multitool — solve the whiteboard riddle first.';
                            if (has('multitool')) return 'Your brass multitool. It has a blade, a screwdriver, and inexplicably a tiny debugger.';
                            return 'A small brass multitool, freed by your correct answer. TAKE it.';
                        }
                    }
                },
                net: {
                    name: '/mnt/net',
                    desc: function() {
                        var lines = ['A cramped uplink closet. A SATELLITE dish pokes through the ceiling, and PACKETS of light stream past in both directions. A blinking DAEMON — a small floating process with a single glowing eye — hovers by the router, humming to itself.'];
                        lines.push('\nThe daemon watches you. It looks like it wants to TALK.');
                        return lines.join('');
                    },
                    exits: { south: 'tmp' },
                    items: [],
                    look: {
                        satellite: 'The dish points at a patch of sky between two other patches of sky. NET: ▲ 1.21 Gbit/s. Somewhere out there, the rest of the internet is having a normal one.',
                        packets: 'TCP packets zip by, politely acknowledging each other. A lone UDP packet blows past without a care, unacknowledged and free. You almost envy it.',
                        daemon: 'A friendly system daemon, PID 1. It has kept the uplink alive alone for 2,847 days. Its eye is warm. It would very much like it if you would TALK to it.',
                        router: 'A router older than the epoch. Its lights spell, if you squint, "still here."',
                        ping: 'You mentally ping the void. 64 bytes from the-universe: time=inf ms. Reply eventually.'
                    }
                },
                home: {
                    name: '/home/simon',
                    desc: function() {
                        var lines = ['Not a machine room at all — a lived-in study. Warm lamplight. A GUITAR leans in the corner, a PLANT that\'s somehow still alive, and a wall of PHOTOS. A DESK is buried under papers about diffusion models and attention. A ginger CAT is asleep on the keyboard.'];
                        lines.push('\nThis is where the operator actually lives. It smells like coffee and half-finished ideas.');
                        return lines.join('');
                    },

            ''
        ];

        if (sessionStorage.getItem('petre-os-v4')) {
            setTimeout(showTerminal, 0);
        } else {
            var skipH = function() {
                document.removeEventListener('keydown', skipH);
                document.removeEventListener('click', skipH);
                document.removeEventListener('touchstart', skipH);
                if (!booted) showTerminal();
            };
            document.addEventListener('keydown', skipH);
            document.addEventListener('click', skipH);
            document.addEventListener('touchstart', skipH);

            var li = 0;
            (function typeLine() {
                if (booted) return;
                if (li < bootLines.length) {
                    var d = document.createElement('div'); d.textContent = bootLines[li] || ' ';
                    bootText.appendChild(d); li++;
                    setTimeout(typeLine, bootLines[li - 1] === '' ? 170 : 45 + Math.random() * 65);
                } else { runBootProgress(showTerminal); }
            })();
        }
        function runBootProgress(done) {
            var bar = document.createElement('div'); bootText.appendChild(bar); var pct = 0;
            (function step() {
                if (booted) return;
                var filled = Math.round(pct / 5); var s = '';
                for (var b = 0; b < 20; b++) s += (b < filled ? '█' : '░');
                bar.textContent = '[' + s + '] ' + pct + '%';
                if (pct >= 100) { setTimeout(done, 300); return; }
                pct += 5 + Math.floor(Math.random() * 9); if (pct > 100) pct = 100;
                setTimeout(step, 42);
            })();
        }

    })();
    </script>
