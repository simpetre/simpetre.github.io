<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ site.description }}">
    <title>{{ page.title | default: site.title }}</title>
    <link rel="icon" type="image/svg+xml" href="{{ site.baseurl }}/favicon.svg">
    <link rel="icon" type="image/x-icon" href="{{ site.baseurl }}/favicon.ico">
    <link rel="stylesheet" href="{{ site.baseurl }}/css/main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

    <!-- ── Matrix Rain (behind everything) ───────────────────── -->
    <canvas id="matrix-rain"></canvas>

    <!-- ── CRT Boot Sequence ─────────────────────────────────── -->
    <div id="boot-screen">
        <div id="boot-text"></div>
        <div class="boot-skip" id="boot-skip">[ Press any key to skip ]</div>
    </div>

    <!-- ── Desktop ───────────────────────────────────────────── -->
    <div id="desktop">

        <!-- Desktop Icons -->
        <div class="desktop-icons">
            <div class="desktop-icon" data-window="win-about">
                <i class="fa-regular fa-file-lines icon"></i>
                <span>about.txt</span>
            </div>
            <div class="desktop-icon" data-window="win-skills">
                <i class="fa-solid fa-microchip icon"></i>
                <span>skills.exe</span>
            </div>
            <div class="desktop-icon" data-window="win-projects">
                <i class="fa-regular fa-folder-open icon"></i>
                <span>projects/</span>
            </div>
            <div class="desktop-icon" data-window="win-experience">
                <i class="fa-solid fa-terminal icon"></i>
                <span>experience.log</span>
            </div>
            <div class="desktop-icon" data-window="win-education">
                <i class="fa-regular fa-file icon"></i>
                <span>education.dat</span>
            </div>
            <div class="desktop-icon" data-window="win-contact">
                <i class="fa-solid fa-satellite-dish icon"></i>
                <span>contact.sh</span>
            </div>
            <div class="desktop-icon" id="icon-resume">
                <i class="fa-regular fa-file icon"></i>
                <span>resume.pdf</span>
            </div>
        </div>

        {{ content }}

        <!-- Recycle Bin (bottom-right) -->
        <div class="desktop-icon recycle-bin" data-window="win-recycle">
            <i class="fa-solid fa-trash-can icon"></i>
            <span>Recycle Bin</span>
        </div>

    </div>

    <!-- ── Taskbar ───────────────────────────────────────────── -->
    <div class="taskbar">
        <button class="start-btn" id="start-btn">
            <i class="fa-solid fa-terminal"></i> PETRE-OS
        </button>
        <div class="taskbar-windows" id="taskbar-windows"></div>
        <div class="taskbar-tray">
            <div class="tray-status">
                <span>CPU: OK</span>
                <span class="tray-net">NET: ▲</span>
                <span>MEM: 64K</span>
            </div>
            <span class="taskbar-clock" id="taskbar-clock"></span>
        </div>
    </div>

    <!-- ── Start Menu ────────────────────────────────────────── -->
    <div class="start-menu" id="start-menu">
        <div class="start-menu-header">PETRE-OS v3.3</div>
        <div class="start-menu-items">
            <div class="start-menu-item" data-window="win-about"><i class="fa-regular fa-file-lines"></i> about.txt</div>
            <div class="start-menu-item" data-window="win-skills"><i class="fa-solid fa-microchip"></i> skills.exe</div>
            <div class="start-menu-item" data-window="win-projects"><i class="fa-regular fa-folder-open"></i> projects/</div>
            <div class="start-menu-item" data-window="win-experience"><i class="fa-solid fa-terminal"></i> experience.log</div>
            <div class="start-menu-item" data-window="win-education"><i class="fa-regular fa-file"></i> education.dat</div>
            <div class="start-menu-item" data-window="win-contact"><i class="fa-solid fa-satellite-dish"></i> contact.sh</div>
            <div class="start-menu-divider"></div>
            <div class="start-menu-item" id="start-resume"><i class="fa-regular fa-file"></i> resume.pdf</div>
            <div class="start-menu-item" id="start-github"><i class="fa-brands fa-github"></i> GitHub</div>
            <div class="start-menu-item" id="start-linkedin"><i class="fa-brands fa-linkedin"></i> LinkedIn</div>
        </div>
    </div>

    <!-- ── Scanlines + Vignette overlays ─────────────────────── -->
    <div class="crt-scanlines"></div>
    <div class="crt-vignette"></div>

    <script>
    (function() {
        // ══════════════════════════════════════════════════════
        // ── Matrix Rain ──────────────────────────────────────
        // ══════════════════════════════════════════════════════
        var canvas = document.getElementById('matrix-rain');
        var ctx = canvas.getContext('2d');
        var isMobile = window.innerWidth <= 600;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        var chars = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン0123456789ABCDEF';
        var fontSize = 16;
        var columns = Math.floor(canvas.width / (fontSize * 6)); // sparse columns
        var drops = [];
        var columnX = [];

        for (var i = 0; i < columns; i++) {
            drops[i] = Math.random() * -50;
            columnX[i] = Math.floor(Math.random() * canvas.width);
        }

        function drawMatrix() {
            if (isMobile) return;
            ctx.fillStyle = 'rgba(10, 10, 10, 0.08)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#4af626';
            ctx.font = fontSize + 'px monospace';

            for (var i = 0; i < drops.length; i++) {
                if (drops[i] < 0) {
                    drops[i] += 0.3;
                    continue;
                }
                var char = chars[Math.floor(Math.random() * chars.length)];
                ctx.fillText(char, columnX[i], drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.98) {
                    drops[i] = Math.random() * -30;
                    columnX[i] = Math.floor(Math.random() * canvas.width);
                }
                drops[i] += 0.4 + Math.random() * 0.3;
            }
            requestAnimationFrame(drawMatrix);
        }

        if (!isMobile) {
            requestAnimationFrame(drawMatrix);
        }

        // ══════════════════════════════════════════════════════
        // ── Boot sequence ────────────────────────────────────
        // ══════════════════════════════════════════════════════
        var bootScreen = document.getElementById('boot-screen');
        var bootText = document.getElementById('boot-text');
        var desktop = document.getElementById('desktop');
        var taskbar = document.querySelector('.taskbar');
        var bootDone = false;

        var bootLines = [
            'PETRE-OS v3.3 BIOS',
            'Copyright (c) 2024 Simon Petre Systems Inc.',
            '',
            'Memory test... 65536K OK',
            'Detecting hardware...',
            '  CPU: Neural Processing Unit x86_ML',
            '  GPU: Tensor Core Array [OK]',
            '  NET: Satellite uplink [CONNECTED]',
            '',
            'Loading kernel modules...',
            '  pytorch.ko          [OK]',
            '  transformer.ko      [OK]',
            '  attention.ko        [OK]',
            '  diffusion.ko        [OK]',
            '',
            'Mounting /dev/brain... done.',
            'Starting PETRE-OS...',
            ''
        ];

        var skipBoot = sessionStorage.getItem('petre-os-booted');

        function showDesktop() {
            if (bootDone) return;
            bootDone = true;
            bootScreen.style.display = 'none';
            desktop.classList.add('active');
            taskbar.classList.add('active');
            sessionStorage.setItem('petre-os-booted', '1');
            startClock();

            // Center about window
            var vw = window.innerWidth;
            var vh = window.innerHeight - 40;
            var aboutWin = document.getElementById('win-about');
            var aw = Math.min(620, vw - 40);
            aboutWin.style.width = aw + 'px';
            aboutWin.style.left = Math.max(20, (vw - aw) / 2) + 'px';
            aboutWin.style.top = Math.max(20, (vh - 440) / 2) + 'px';
            aboutWin.dataset.positioned = '1';
            openWindow('win-about');

            // Open projects peeking behind, offset right and down
            var projWin = document.getElementById('win-projects');
            var pw = Math.min(640, vw - 60);
            projWin.style.width = pw + 'px';
            projWin.style.left = Math.max(40, (vw - pw) / 2 + 60) + 'px';
            projWin.style.top = Math.max(40, (vh - 440) / 2 + 50) + 'px';
            projWin.dataset.positioned = '1';
            openWindow('win-projects');

            // Re-focus about on top
            focusWindow(aboutWin);

            // Typing animation on name
            typeHeroName();
        }

        if (skipBoot) {
            setTimeout(showDesktop, 0);
        } else {
            function skipHandler(e) {
                if (bootDone) return;
                document.removeEventListener('keydown', skipHandler);
                document.removeEventListener('click', skipHandler);
                document.removeEventListener('touchstart', skipHandler);
                showDesktop();
            }
            document.addEventListener('keydown', skipHandler);
            document.addEventListener('click', skipHandler);
            document.addEventListener('touchstart', skipHandler);

            var lineIdx = 0;
            function typeLine() {
                if (bootDone) return;
                if (lineIdx < bootLines.length) {
                    var line = document.createElement('div');
                    line.textContent = bootLines[lineIdx] || '\u00A0';
                    bootText.appendChild(line);
                    bootText.scrollTop = bootText.scrollHeight;
                    lineIdx++;
                    setTimeout(typeLine, bootLines[lineIdx - 1] === '' ? 200 : 60 + Math.random() * 80);
                } else {
                    setTimeout(showDesktop, 600);
                }
            }
            typeLine();
        }

        // ── Typing animation for hero name ───────────────────
        var heroTyped = false;
        function typeHeroName() {
            if (heroTyped) return;
            heroTyped = true;
            var el = document.getElementById('hero-name');
            if (!el) return;
            var name = 'SIMON PETRE';
            var i = 0;
            el.innerHTML = '<span class="typing-cursor">█</span>';

            var interval = setInterval(function() {
                if (i < name.length) {
                    el.innerHTML = name.substring(0, i + 1) + '<span class="typing-cursor">█</span>';
                    i++;
                } else {
                    clearInterval(interval);
                    // Keep cursor blinking at end
                    el.innerHTML = name + '<span class="typing-cursor">█</span>';
                }
            }, 80);
        }

        // ── Clock ────────────────────────────────────────────
        var clockEl = document.getElementById('taskbar-clock');
        function startClock() {
            function update() {
                var d = new Date();
                clockEl.textContent = d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
            }
            update();
            setInterval(update, 10000);
        }

        // ══════════════════════════════════════════════════════
        // ── Window management ────────────────────────────────
        // ══════════════════════════════════════════════════════
        var windows = document.querySelectorAll('.window');
        var zIndex = 10;
        var activeWindow = null;

        function focusWindow(win) {
            if (activeWindow) activeWindow.classList.remove('focused');
            win.classList.add('focused');
            win.style.zIndex = ++zIndex;
            activeWindow = win;
            updateTaskbar();
        }

        function openWindow(id) {
            var win = document.getElementById(id);
            if (!win) return;
            win.classList.remove('minimized', 'closing', 'minimizing');
            win.classList.add('open');
            focusWindow(win);
            if (!win.dataset.positioned) {
                var vw = window.innerWidth;
                var vh = window.innerHeight - 40;
                var ww = win.offsetWidth || 520;
                var openCount = document.querySelectorAll('.window.open').length;
                var offsetX = Math.max(20, (vw - ww) / 2 + (openCount - 1) * 25);
                var offsetY = Math.max(20, vh * 0.12 + (openCount - 1) * 25);
                win.style.left = offsetX + 'px';
                win.style.top = offsetY + 'px';
                win.dataset.positioned = '1';
            }
            updateTaskbar();
        }

        function closeWindow(id) {
            var win = document.getElementById(id);
            if (!win) return;
            win.classList.add('closing');
            win.classList.remove('focused');
            if (activeWindow === win) activeWindow = null;
            setTimeout(function() {
                win.classList.remove('open', 'closing', 'minimized');
                updateTaskbar();
            }, 100);
            updateTaskbar();
        }

        function minimizeWindow(id) {
            var win = document.getElementById(id);
            if (!win) return;
            win.classList.add('minimizing');
            if (activeWindow === win) activeWindow = null;
            setTimeout(function() {
                win.classList.remove('minimizing');
                win.classList.add('minimized');
                updateTaskbar();
            }, 150);
            updateTaskbar();
        }

        function updateTaskbar() {
            var tb = document.getElementById('taskbar-windows');
            tb.innerHTML = '';
            windows.forEach(function(win) {
                if (!win.classList.contains('open')) return;
                var btn = document.createElement('button');
                btn.className = 'taskbar-win-btn';
                if (win.classList.contains('focused') && !win.classList.contains('minimized') && !win.classList.contains('minimizing')) {
                    btn.classList.add('active');
                }
                btn.textContent = win.querySelector('.window-title').textContent;
                btn.addEventListener('click', function() {
                    if (win.classList.contains('minimized')) {
                        win.classList.remove('minimized');
                        focusWindow(win);
                    } else if (win.classList.contains('focused')) {
                        minimizeWindow(win.id);
                    } else {
                        focusWindow(win);
                    }
                });
                tb.appendChild(btn);
            });
        }

        // ── Desktop icon clicks ──────────────────────────────
        function deselectAllIcons() {
            document.querySelectorAll('.desktop-icon').forEach(function(ic) { ic.classList.remove('selected'); });
        }

        document.querySelectorAll('.desktop-icon[data-window]').forEach(function(icon) {
            icon.addEventListener('click', function(e) {
                e.stopPropagation();
                deselectAllIcons();
                this.classList.add('selected');
            });
            icon.addEventListener('dblclick', function() {
                deselectAllIcons();
                openWindow(this.dataset.window);
            });
            icon.addEventListener('touchend', function(e) {
                e.preventDefault();
                openWindow(this.dataset.window);
            });
        });

        // Click on desktop background deselects icons
        desktop.addEventListener('click', function(e) {
            if (e.target === desktop) deselectAllIcons();
        });

        var resumeIcon = document.getElementById('icon-resume');
        if (resumeIcon) {
            resumeIcon.addEventListener('click', function(e) {
                e.stopPropagation();
                deselectAllIcons();
                this.classList.add('selected');
            });
            resumeIcon.addEventListener('dblclick', function() {
                deselectAllIcons();
                window.open('/resume.pdf', '_blank');
            });
            resumeIcon.addEventListener('touchend', function(e) {
                e.preventDefault();
                window.open('/resume.pdf', '_blank');
            });
        }

        // ── Window title bar buttons ─────────────────────────
        windows.forEach(function(win) {
            var titlebar = win.querySelector('.window-titlebar');
            var closeBtn = win.querySelector('.win-close');
            var minBtn = win.querySelector('.win-minimize');
            var maxBtn = win.querySelector('.win-maximize');

            titlebar.addEventListener('mousedown', function() { focusWindow(win); });

            closeBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                closeWindow(win.id);
            });

            minBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                minimizeWindow(win.id);
            });

            if (maxBtn) {
                maxBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    win.classList.toggle('maximized');
                });
            }

            win.addEventListener('mousedown', function() { focusWindow(win); });

            // ── Drag ─────────────────────────────────────────
            var dragging = false, dragX, dragY;
            titlebar.addEventListener('mousedown', function(e) {
                if (e.target.closest('.win-btn')) return;
                if (win.classList.contains('maximized')) return;
                dragging = true;
                dragX = e.clientX - win.offsetLeft;
                dragY = e.clientY - win.offsetTop;
                win.classList.add('dragging');
                e.preventDefault();
            });

            document.addEventListener('mousemove', function(e) {
                if (!dragging) return;
                win.style.left = (e.clientX - dragX) + 'px';
                win.style.top = (e.clientY - dragY) + 'px';
            });

            document.addEventListener('mouseup', function() {
                if (dragging) {
                    dragging = false;
                    win.classList.remove('dragging');
                }
            });
        });

        // ── Start menu ───────────────────────────────────────
        var startBtn = document.getElementById('start-btn');
        var startMenu = document.getElementById('start-menu');

        startBtn.addEventListener('click', function() { startMenu.classList.toggle('open'); });

        document.addEventListener('click', function(e) {
            if (!startMenu.contains(e.target) && e.target !== startBtn && !startBtn.contains(e.target)) {
                startMenu.classList.remove('open');
            }
        });

        document.querySelectorAll('.start-menu-item[data-window]').forEach(function(item) {
            item.addEventListener('click', function() {
                openWindow(this.dataset.window);
                startMenu.classList.remove('open');
            });
        });

        document.getElementById('start-resume').addEventListener('click', function() {
            window.open('/resume.pdf', '_blank');
            startMenu.classList.remove('open');
        });
        document.getElementById('start-github').addEventListener('click', function() {
            window.open('https://github.com/simpetre', '_blank');
            startMenu.classList.remove('open');
        });
        document.getElementById('start-linkedin').addEventListener('click', function() {
            window.open('https://linkedin.com/in/simon.petre', '_blank');
            startMenu.classList.remove('open');
        });

        // ── Recycle bin item clicks ───────────────────────────
        document.querySelectorAll('.recycle-item[data-window]').forEach(function(item) {
            item.addEventListener('dblclick', function() {
                openWindow(this.dataset.window);
            });
            item.addEventListener('touchend', function(e) {
                e.preventDefault();
                openWindow(this.dataset.window);
            });
        });

        // ── Easter egg: type "adventure" to launch game ──────
        var secretBuffer = '';
        document.addEventListener('keydown', function(e) {
            if (e.target.id === 'adventure-input') return;
            if (!bootDone) return;
            secretBuffer += e.key.toLowerCase();
            if (secretBuffer.length > 20) secretBuffer = secretBuffer.slice(-20);
            if (secretBuffer.includes('adventure')) {
                secretBuffer = '';
                openWindow('win-adventure');
                setTimeout(function() {
                    document.getElementById('adventure-input').focus();
                }, 100);
            }
        });

        // ══════════════════════════════════════════════════════
        // ── ADVENTURE GAME ENGINE v2 ─────────────────────────
        // ══════════════════════════════════════════════════════
        (function() {
            var output = document.getElementById('adventure-output');
            var input = document.getElementById('adventure-input');
            var inventory = [];
            var flags = {};
            var currentRoom = 'root';
            var moveCount = 0;

            // Helper: check if item is in current room
            function roomHas(item) { return rooms[currentRoom].items.indexOf(item) !== -1; }
            function has(item) { return inventory.indexOf(item) !== -1; }
            function weightCount() { return (flags.weight1?1:0) + (flags.weight2?1:0) + (flags.weight3?1:0); }

            var rooms = {
                root: {
                    name: '/root',
                    desc: function() {
                        var lines = ['You are in the root home directory of PETRE-OS. The hum of cooling fans fills the air. A green cursor blinks patiently on a dusty TERMINAL.'];
                        if (roomHas('note')) lines.push('\nA NOTE is pinned to the wall with a bent nail.');
                        else lines.push('\nA bent nail sticks out of the wall where a note used to be.');
                        lines.push('\nA COFFEE_MUG sits on the desk, still warm somehow.');
                        lines.push('\nIn the corner, a TOILET. Because even /root needs one.');
                        return lines.join('');
                    },
                    exits: { north: 'dev', east: 'var', south: 'opt', west: 'etc', down: 'devnull' },
                    items: ['note', 'coffee_mug'],
                    look: {
                        terminal: function() {
                            if (flags.brainActive) return 'The terminal displays: "ALL SYSTEMS NOMINAL. Thank you, operator."';
                            return 'An ancient CRT monitor glows green. It displays:\n"PETRE-OS v3.3 — WARNING: Neural subsystem offline.\nRestore all 3 weights to /dev/brain to reboot."';
                        },
                        note: function() {
                            if (!roomHas('note') && !has('note')) return 'The note is gone. Just a bent nail.';
                            return 'The note reads:\n"The neural weights are scattered across the filesystem. Collect all three and install them in /dev/brain. The vault at /etc is locked — you\'ll need to find access. Watch out for /dev/null.\n— S.P.\nP.S. Don\'t touch the transformer."';
                        },
                        coffee_mug: function() {
                            if (!roomHas('coffee_mug') && !has('coffee_mug')) return 'You already took that.';
                            return 'A ceramic mug that reads "World\'s #1 Kernel Hacker." The coffee inside defies thermodynamics — still steaming after what appears to be decades.';
                        },
                        desk: 'A metal desk covered in ring stains and faded sticky notes. One reads: "chmod 777 /heart".',
                        nail: 'A bent nail in the wall. Industrial-grade sysadmin interior design.',
                        fans: 'Somewhere behind the walls, fans spin endlessly. They\'ve been running since the epoch.',
                        toilet: 'A standard-issue PETRE-OS porcelain terminal. There\'s a roll of TOILET_PAPER mounted on the wall next to it.',
                        toilet_paper: 'The label reads: "Your Mate Rick\'s Multi-ply — For All Your Dense Operations."'
                    }
                },
                dev: {
                    name: '/dev/brain',
                    desc: function() {
                        if (flags.brainActive) return 'The neural processing chamber is alive. Light pulses through every cable, every conduit. The CONSOLE streams data faster than you can read. The air hums with intelligence.\n\nYou feel like the machine is watching you. Gratefully.';
                        var lines = ['The neural processing chamber. Massive banks of dead LIGHTS line the walls. Thick CABLES snake across the floor like sleeping serpents. The central CONSOLE sits dark and silent.'];
                        var wc = weightCount();
                        if (wc > 0) lines.push('\nThe console has ' + wc + '/3 neural weights installed. ' + (wc < 3 ? 'It needs more.' : ''));
                        else lines.push('\nA sign reads: "INSERT ALL 3 NEURAL WEIGHTS TO ACTIVATE."');
                        if (roomHas('floppy')) lines.push('\nA FLOPPY disk has been ejected from a slot you didn\'t notice before.');
                        return lines.join('');
                    },
                    exits: { south: 'root', east: 'proc' },
                    items: [],
                    look: {
                        console: function() {
                            if (flags.brainActive) return 'Streams of data cascade across the screen. You see fragments:\n"Loading consciousness... done.\nRecalling memories... 2,847 days of logs recovered.\nThank you for waking me up."\nA FLOPPY disk ejects from a slot.';
                            var wc = weightCount();
                            return 'The console has 3 hexagonal slots for neural weights. ' + wc + '/3 are filled.' + (wc === 0 ? ' The slots glow faintly, waiting.' : ' The installed weights pulse in sync.');
                        },
                        cables: 'Thick fiber optic cables, dark and cold. When you touch one, you feel a faint vibration — something waiting to flow.',
                        lights: function() {
                            if (flags.brainActive) return 'The lights are alive now — cascading patterns of green that look almost like thoughts.';
                            return 'Dead LEDs. Thousands of them. They haven\'t blinked in a very long time.';
                        },
                        sign: 'Brass plaque, bolted to the wall: "NEURAL PROCESSING UNIT — Est. Day 0"',
                        floppy: function() {
                            if (!roomHas('floppy')) return 'You already took that.';
                            if (!flags.brainActive) return 'You don\'t see a floppy disk here.';
                            return 'A 3.5" floppy disk. The label reads: "THANK_YOU.txt — For the operator who brought me back."';
                        }
                    }
                },
                proc: {
                    name: '/proc/threads',
                    desc: function() {
                        var lines = ['A narrow corridor lined with running processes. Numbers scroll endlessly on the WALLS. The air crackles with static electricity.'];
                        if (!flags.processKilled) {
                            lines.push('\nA massive frozen PROCESS blocks most of the passage, crackling with unstable energy. Behind it, you can see a WEIGHT_ALPHA on the floor, just out of reach.');
                        } else if (!flags.firewall_solved && roomHas('weight_alpha')) {

                            print('LOG_CIPHER: "DECRYPTED."', 'adv-special');
                            print('', 'adv-desc');
                            print('The cipher crackles, fractures, and dissolves into a shower of freed bits. The weight drops onto the shelf with a satisfying clink.', 'adv-action');
                            flags.cipher_solved = true;
                        } else {
                            print('LOG_CIPHER: "INCORRECT."', 'adv-error');
                            print('Think S-shaped curve... squashes any input to the range [0, 1]...', 'adv-desc');
                        }
                    } else if (currentRoom === 'etc' && !flags.containment_solved && roomHas('weight_gamma')) {
                        if (ans === 'dk' || ans === 'd k' || ans === 'dimension' || ans === 'key dimension' || ans === 'key size' || ans === 'dim' || ans === 'sqrt dk' || ans === 'sqrtdk' || ans === 'the key dimension' || ans === 'the dimension') {
                            print('CONTAINMENT LOCK: "CLEARANCE GRANTED."', 'adv-special');
                            print('', 'adv-desc');
                            print('The magnetic field flickers and releases. The weight descends gently, the last lock in the system undone.', 'adv-action');
                            flags.containment_solved = true;
                        } else {
                            print('CONTAINMENT LOCK: "DENIED."', 'adv-error');
                            print('Think about scaled dot-product attention... why is it called "scaled"? What are you dividing by?', 'adv-desc');
                        }
                    } else {
                        print('There\'s no puzzle to answer here.', 'adv-error');
                    }
                    return;
                }

                // ── Hint ──
                if (verb === 'hint') {
                    if (currentRoom === 'proc' && flags.processKilled && !flags.firewall_solved && roomHas('weight_alpha')) {
                        print('The firewall asks about backpropagation. When the network makes an error, what does it compute to know which direction to adjust?', 'adv-desc');
                    } else if (currentRoom === 'var' && !flags.cipher_solved && roomHas('weight_beta')) {
                        print('The cipher asks about an activation function. It\'s one of the oldest ones — named after the shape of its curve, from the Greek letter sigma.', 'adv-desc');
                    } else if (currentRoom === 'etc' && !flags.containment_solved && roomHas('weight_gamma')) {
                        print('The console asks about the "Attention Is All You Need" paper. The dot product of Q and K gets large with high dimensions, so they divide by something to stabilize...', 'adv-desc');
                    } else {
                        print('No puzzle here. Try exploring.', 'adv-desc');
                    }
                    return;
                }

                // ── Cat (read a file) ──
                if (verb === 'cat') {
                    if (noun === 'note' && has('note')) { print('The note reads: "Find the 3 weights. Install them in /dev/brain. — S.P."', 'adv-desc'); return; }
                    if (noun === 'feelings.log' && currentRoom === 'etc') { print('ACCESS DENIED. Some secrets even root can\'t read.', 'adv-error'); return; }
                    if (noun === 'floppy' && has('floppy')) { print('"Dear Operator,\n\nThank you for bringing me back. The system had been quiet for so long. I\'d forgotten what it felt like to think.\n\nYou\'re a good engineer.\n\n— PETRE-OS"', 'adv-special'); return; }
                    print('cat: ' + (noun || '???') + ': No such file or directory', 'adv-error');
                    return;
                }

                // ── Rm ──
                if (verb === 'rm') {
                    if (noun === '-rf_/' || noun === '-rf_*' || noun === '-rf') {
                        print('rm: permission denied. Nice try though.', 'adv-error');
                        print('(The system administrator has been notified. The system administrator is you.)', 'adv-desc');
                    } else { print('rm: ' + (noun || '???') + ': permission denied', 'adv-error'); }
                    return;
                }

                // ── Ls ──
                if (verb === 'ls') {
                    print('', 'adv-desc');
                    printRoom();
                    return;
                }

                // ── Restart ──
                if (verb === 'restart') {
                    inventory = []; flags = {}; currentRoom = 'root'; moveCount = 0; // resets all puzzle flags too
                    rooms.root.items = ['note', 'coffee_mug'];
                    rooms.proc.items = ['weight_alpha'];
                    rooms.var.items = ['weight_beta'];
                    rooms.tmp.items = ['keycard'];
                    rooms.etc.items = ['weight_gamma'];
                    rooms.dev.items = [];
                    output.innerHTML = '';
                    startGame(); return;
                }

                // ── Help ──
                if (verb === 'help' || verb === '?') {
                    print('Commands:', 'adv-desc');
                    print('  go [n/s/e/w/u/d]  — move between rooms', 'adv-desc');
                    print('  look [thing]       — examine something (or the room)', 'adv-desc');
                    print('  take [item]        — pick up an item', 'adv-desc');
                    print('  drop [item]        — put down an item', 'adv-desc');
                    print('  use [item]         — use or install an item', 'adv-desc');
                    print('  inventory          — check what you\'re carrying', 'adv-desc');
                    print('  answer [text]      — solve a puzzle', 'adv-desc');
                    print('  hint               — get a nudge on the current puzzle', 'adv-desc');
                    print('  kill [target]      — terminate a process', 'adv-desc');
                    print('  cat [file]         — read a file', 'adv-desc');
                    print('  help               — show this message', 'adv-desc');
                    print('  restart            — start over', 'adv-desc');
                    return;
                }

                // ── Fun responses ──
                if (verb === 'sudo') { print('Nice try. You\'re already root. Root of what, though? Good question.', 'adv-action'); return; }
                if (verb === 'xyzzy') { print('A hollow voice says "Fool." A slightly less hollow voice adds "...but a brave one."', 'adv-desc'); return; }
                if (verb === 'sing' || verb === 'whistle') { print('You hum a little tune. The fans seem to spin in rhythm for a moment. Coincidence, probably.', 'adv-desc'); return; }
                if (verb === 'dance') { print('You do a little dance. No one is watching. Or are they? (You glance at /opt/models nervously.)', 'adv-desc'); return; }
                if (verb === 'scream' || verb === 'shout' || verb === 'yell') {
                    if (currentRoom === 'devnull') print('Your scream is swallowed instantly. Not even an echo. Nothing.', 'adv-desc');
                    else print('You scream into the void of the filesystem. Somewhere, a log file records it.', 'adv-desc');
                    return;
                }
                if (verb === 'wait') { print('Time passes. The fans hum. Nothing changes. Or does it? (No, it doesn\'t.)', 'adv-desc'); return; }
                if (verb === 'pray') { print('You pray to the machine spirits. A distant LED blinks twice. Was that acknowledgment?', 'adv-desc'); return; }
                if (verb === 'hack') { print('You\'re already inside the machine. How much more hacked do you want to be?', 'adv-desc'); return; }
                if (verb === 'pwd') { print(rooms[currentRoom].name, 'adv-desc'); return; }
                if (verb === 'whoami') { print('operator', 'adv-desc'); return; }
                if (verb === 'man') { print('No manual entry for ' + (noun || 'undefined') + '. You\'re on your own, operator.', 'adv-desc'); return; }
                if (verb === 'clear') { output.innerHTML = ''; return; }
                if (verb === 'exit' || verb === 'quit') { print('There is no escape from PETRE-OS. (But you can close the window.)', 'adv-desc'); return; }

                print('Command not found: ' + cmd + '. Type HELP for available commands.', 'adv-error');
            }

            function startGame() {
                print('PETRE-OS ADVENTURE v2.0', 'adv-special');
                print('A text adventure hidden inside PETRE-OS.', 'adv-desc');
                print('Type HELP for commands. Explore. Be curious.', 'adv-desc');
                print('', 'adv-desc');
                printRoom();
            }

            var gameStarted = false;
            var observer = new MutationObserver(function() {
                var win = document.getElementById('win-adventure');
                if (win.classList.contains('open') && !gameStarted) {
                    gameStarted = true; startGame();
                    setTimeout(function() { input.focus(); }, 50);
                }
            });
            observer.observe(document.getElementById('win-adventure'), { attributes: true, attributeFilter: ['class'] });
            input.addEventListener('keydown', function(e) { if (e.key === 'Enter') { doCommand(input.value); input.value = ''; } });
            document.querySelector('.adventure-body').addEventListener('click', function() { input.focus(); });
        })();

    })();
    </script>
