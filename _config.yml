# Profile picture (LinkedIn photo)
avatar: https://media.licdn.com/mpr/mpr/shrinknp_400_400/AAEAAQAAAAAAAAdoAAAAJDdmYTQ1YjI1LWVjMGYtNDAxMy05ZGM5LTY1ZDc1OGViN2M1OQ.jpg

# Social links
